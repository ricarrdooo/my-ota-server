services:
  app:
    build: .
    restart: unless-stopped
    environment:
      OTA_PUBLIC_URL: https://${OTA_DOMAIN:?Set OTA_DOMAIN in .env}
      OTA_DATA_DIR: /data
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - ota_data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/healthz', headers={'Host': __import__('urllib.parse',fromlist=['urlsplit']).urlsplit(__import__('os').environ['OTA_PUBLIC_URL']).netloc}), timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      OTA_DOMAIN: ${OTA_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  ota_data:
  caddy_data:
  caddy_config:
