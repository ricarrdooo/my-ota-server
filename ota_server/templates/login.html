<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · OTA Station</title><script src="/static/theme.js"></script><link rel="stylesheet" href="/static/app.css"><link rel="stylesheet" href="/static/admin/admin.css"></head>
<body class="login-page"><div class="theme-control login-theme"><span aria-hidden="true">◐</span><select id="theme-select" class="theme-select" data-theme-select aria-label="外观主题"><option value="system">跟随系统</option><option value="light">浅色模式</option><option value="dark">暗色模式</option></select></div><main class="login-card"><div class="login-wordmark"><span class="brand-symbol"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3m-5 5 5-5 5 5M4 14v6h16v-6"/></svg></span>OTA Station</div><h1>欢迎回来</h1><p class="muted">登录你的固件工作台，继续管理设备与发布。</p>
{% if not initialized %}<div class="notice">尚未创建管理员。请先在服务器终端运行 <code>python -m ota_server init</code>。</div>{% endif %}
{% if error %}<div class="notice error" role="alert">{{ error }}</div>{% endif %}
<form method="post" action="/login"><input type="hidden" name="csrf" value="{{ csrf }}"><label>用户名<input name="username" autocomplete="username" maxlength="80" required autofocus></label><label>密码<input name="password" type="password" autocomplete="current-password" maxlength="256" required></label><button class="primary full" type="submit">进入工作台 <span>→</span></button></form><p class="login-foot">独立部署 · 签名验证 · 精确发布</p></main></body></html>
